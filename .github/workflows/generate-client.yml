name: Generate Client

on:
    pull_request:
        types:
            - opened
            - synchronize
        branches:
            - main
            - dev
        paths:
            - "backend/**"
            - ".github/workflows/generate-client.yml"

jobs:
    generate-client:
        if: github.actor != 'dependabot[bot]'
        permissions:
            contents: write
        runs-on: ubuntu-latest
        steps:
            # For PRs from forks
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            # For PRs from the same repo
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              if: ( github.event_name != 'pull_request' || github.secret_source == 'Actions' )
              with:
                  ref: ${{ github.head_ref }}
                  token: ${{ secrets.GITHUB_TOKEN }}
            # Must precede setup-node: `cache: pnpm` shells out to `pnpm store path`,
            # so pnpm has to be on PATH already.
            - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
              with:
                  package_json_file: frontend/package.json
            - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
              with:
                  node-version: lts/*
                  cache: pnpm
                  cache-dependency-path: frontend/pnpm-lock.yaml
            - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
              with:
                  python-version: "3.13"
            - name: Install uv
              uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
              with:
                  version: "0.4.15"
                  enable-cache: true
            - name: Install dependencies
              run: pnpm install --frozen-lockfile
              working-directory: frontend
            - run: uv sync
              working-directory: backend
            - name: Create .env file
              run: cp .env.example .env
            - run: uv run bash scripts/generate-client.sh
              env:
                  VIRTUAL_ENV: backend/.venv
            - name: Add changes to git
              run: |
                  git config --local user.email "github-actions@github.com"
                  git config --local user.name "github-actions"
                  git add frontend/src/client
            # Same repo PRs
            - name: Push changes
              if: ( github.event_name != 'pull_request' || github.secret_source == 'Actions' )
              run: |
                  git diff --staged --quiet || git commit -m "✨ Autogenerate frontend client"
                  git push
            # Fork PRs
            - name: Check changes
              if: ( github.event_name == 'pull_request' && github.secret_source != 'Actions' )
              run: |
                  git diff --staged --quiet || (echo "Changes detected in generated client, run scripts/generate-client.sh and commit the changes" && exit 1)
