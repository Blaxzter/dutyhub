[project]
name = "app"
version = "0.1.0"
description = ""
requires-python = ">=3.13,<4.0"
dependencies = [
    # FastAPI with the standard extras - supports Python 3.13
    "fastapi[standard]>=0.141.0,<1.0.0",

    # Updated dependencies with latest compatible versions
    "python-multipart>=0.0.32,<1.0.0",
    "email-validator>=2.3.0,<3.0.0",
    "tenacity>=9.1.4,<10.0.0",

    "pydantic>=2.13.4,<3.0.0",
    "fastapi-mail>=1.6.5,<2.0",
    "jinja2>=3.1.6,<4.0.0",
    "alembic>=1.18.5,<2.0.0",
    "httpx>=0.28.1,<1.0.0",
    "psycopg[binary]>=3.3.4,<4.0.0",
    "sqlmodel>=0.0.39,<1.0.0",
    "asyncpg>=0.31.0,<1.0.0",

    "bcrypt>=5.0.0",

    "pydantic-settings>=2.14.2,<3.0.0",
    "sentry-sdk[fastapi]>=2.66.1,<3.0.0",
    "pyjwt>=2.13.0,<3.0.0",

    # Force newer httptools version for Python 3.13 compatibility
    "httptools>=0.8.0,<1.0.0",
    "auth0-fastapi-api>=1.0.0b7",
    "pywebpush>=2.3.0,<3.0.0",
    "icalendar>=7.2.2,<8.0.0",
    "pillow>=12.3.0,<13.0.0",
]

[tool.uv]
dev-dependencies = [
    "pytest>=9.1.1,<10.0.0",
    "pytest-asyncio>=1.4.0,<2.0.0",
    "basedpyright>=1.39.9,<2.0.0",
    "ruff>=0.16.0,<1.0.0",
    "pre-commit>=4.6.1,<5.0.0",
    "coverage>=7.15.2,<8.0.0",
    "pytest-testmon>=2.2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.basedpyright]
typeCheckingMode = "strict"
include = ["app", "tests"]
exclude = ["**/alembic"]
reportMissingTypeStubs = "warning"

[tool.ruff]
target-version = "py310"
exclude = ["alembic"]

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "ARG001", # unused arguments in functions
]
ignore = [
    "E501",  # line too long, handled by black
    "B008",  # do not perform function calls in argument defaults
    "W191",  # indentation contains tabs
    "B904",  # Allow raising exceptions without from e, for HTTPException
]

[tool.ruff.lint.pyupgrade]
# Preserve types, even if a file imports `from __future__ import annotations`.
keep-runtime-typing = true

[tool.coverage.run]
source = ["app"]
# Required: without greenlet tracking, coverage cannot follow execution across
# SQLAlchemy's greenlet boundary and async route bodies read as uncovered
# (understates the total by ~13 points). Set here rather than on a single
# command line so every entry point — `just test-backend`, `scripts/test.sh`,
# and CI — reports the same number.
concurrency = ["greenlet"]
omit = [
    "app/api/routes/demo_data.py",
    "app/api/routes/debug.py",
    "app/api/routes/testing.py",
    "app/api/routes/notifications/telegram.py",
    "app/crud/telegram_binding.py",
    "app/logic/notifications/channels/telegram.py",
    "app/logic/notifications/channels/email.py",
    "app/logic/notifications/channels/push.py",
    "app/logic/auth0/auth0_service.py",
    "app/main.py",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
